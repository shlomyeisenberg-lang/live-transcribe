# One-time copy of releases from the old public source repo (before it goes
# private): the downloads and the Qwen3-ASR Hebrew model the app fetches.
name: Import releases
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/import-release.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Copy releases
        env:
          GH_TOKEN: ${{ github.token }}
          SRC: shlomyeisenberg-lang/hebrew-live-transcribe
        run: |
          set -e
          copy() { # tag latest skip-regex
            tag=$1
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "$tag exists"; return; fi
            curl -fsSL "https://api.github.com/repos/$SRC/releases/tags/$tag" > rel.json
            jq -r .body rel.json > body.md
            mkdir -p "a-$tag"
            jq -r '.assets[] | .name + " " + .browser_download_url' rel.json | while read n u; do
              if [[ -n "$3" && "$n" =~ $3 ]]; then echo "skip $n"; continue; fi
              curl -fsSL -o "a-$tag/$n" "$u"
            done
            ls -la "a-$tag"
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --target main --title "$(jq -r .name rel.json)" --notes-file body.md --latest=$2 a-$tag/*
            rm -rf "a-$tag"
          }
          copy model-qwen-asr-he-v1 false ''
          copy v1.6.0 true 'source\.zip$'
